name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            ghc: '9.12.2'
          - name: macos-x86_64
            os: macos-13
            ghc: '9.12.2'
          - name: macos-aarch64
            os: macos-14
            ghc: '9.12.2'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.14.1.0'
          cabal-update: true

      - name: Cache Cabal packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
          key: ${{ runner.os }}-${{ runner.arch }}-cabal-${{ hashFiles('cabal.project.freeze', 'paper.cabal') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cabal-

      - name: Build executable
        run: cabal build exe:paper --enable-optimization

      - name: Validate executable
        shell: bash
        run: |
          set -euo pipefail
          binary="$(cabal list-bin exe:paper)"
          test -x "$binary"
          "$binary" --help
          tmp_dir="$(mktemp -d)"
          "$binary" init "$tmp_dir/project"
          test -f "$tmp_dir/project/AGENTS.md"

      - name: Package executable
        shell: bash
        env:
          PLATFORM: ${{ matrix.name }}
        run: |
          set -euo pipefail
          binary="$(cabal list-bin exe:paper)"
          archive="paper-${PLATFORM}.tar.gz"
          staging="paper-${PLATFORM}"
          mkdir "$staging"
          cp "$binary" "$staging/paper"
          tar -czf "$archive" "$staging"
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ matrix.name }}
          path: |
            paper-${{ matrix.name }}.tar.gz
            paper-${{ matrix.name }}.tar.gz.sha256

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
